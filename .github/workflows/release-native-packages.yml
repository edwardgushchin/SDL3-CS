name: Release native packages

on:
  workflow_dispatch:
    inputs:
      package_revision:
        description: Numeric SDL3-CS release revision; the manifest may remap occupied component package revisions.
        required: true
        default: "1"
      managed_only:
        description: Build and publish only the managed SDL3-CS package without running the native matrix.
        required: true
        type: boolean
        default: false
      native_package_revision:
        description: Already published native package revision used by managed-only tests and consumers.
        required: true
        default: "1"
      base_release_ref:
        description: Previous release ref used to prove that native inputs did not change for managed-only releases.
        required: true
        default: "v3.4.12.1"
      build_parallel_level:
        description: CMake build parallel level for constrained hosted runners.
        required: true
        default: "2"
      native_rids:
        description: Optional comma-separated native RID scope for non-publishing branch validation; empty selects the full manifest.
        required: false
        default: ""
      require_upstream_current:
        description: Fail assembly when forks are not current with libsdl-org upstream main.
        required: true
        type: boolean
        default: false
      publish_github:
        description: Create the GitHub release after package assembly.
        required: true
        type: boolean
        default: false
      publish_nuget:
        description: Push packages to NuGet after package assembly.
        required: true
        type: boolean
        default: false
      selective_native_repack:
        description: Repack exact published native packages without running the native matrix.
        required: true
        type: boolean
        default: false
      selective_repack_mode:
        description: Repack content mode. Use version-only when only a common family revision is required.
        required: true
        type: choice
        options:
          - add-libwebp-license
          - version-only
        default: add-libwebp-license
      previous_native_package_revision:
        description: Published source revision for selective native package repack.
        required: true
        default: "7"
      selective_package_ids:
        description: Comma-separated exact native package IDs for selective repack.
        required: true
        default: SDL3-CS.Android.Image,SDL3-CS.Linux.Image,SDL3-CS.Windows.Image
      publish_selective_nuget:
        description: Publish validated selective native repacks through trusted publishing.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  validate-mode:
    name: Validate release mode
    runs-on: ubuntu-latest

    steps:
      - name: Enforce exclusive release mode
        shell: pwsh
        env:
          NATIVE_RIDS: ${{ inputs.native_rids }}
        run: |
          $selective = '${{ inputs.selective_native_repack }}' -eq 'true'
          $repackMode = '${{ inputs.selective_repack_mode }}'
          $managed = '${{ inputs.managed_only }}' -eq 'true'
          $normalPublish = '${{ inputs.publish_github }}' -eq 'true' -or '${{ inputs.publish_nuget }}' -eq 'true'
          $selectivePublish = '${{ inputs.publish_selective_nuget }}' -eq 'true'
          if ($selective -and -not $managed) {
            throw 'Selective native repack requires managed_only=true so the full native matrix stays disabled.'
          }
          if ($selective -and $normalPublish) {
            throw 'Selective native repack requires publish_github=false and publish_nuget=false.'
          }
          if (-not $selective -and $selectivePublish) {
            throw 'publish_selective_nuget requires selective_native_repack=true.'
          }
          if ($selective -and $repackMode -notin @('add-libwebp-license', 'version-only')) {
            throw "Unsupported selective repack mode: $repackMode"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NATIVE_RIDS) -and $managed) {
            throw 'native_rids can be used only when managed_only=false.'
          }

  plan:
    name: Plan native matrix
    if: ${{ !inputs.managed_only }}
    needs: validate-mode
    runs-on: ubuntu-latest
    outputs:
      native_matrix: ${{ steps.native-matrix.outputs.native_matrix }}
      bundle_count: ${{ steps.native-matrix.outputs.bundle_count }}
      selected_rids: ${{ steps.native-matrix.outputs.selected_rids }}
      full_scope: ${{ steps.native-matrix.outputs.full_scope }}
      has_android: ${{ steps.native-matrix.outputs.has_android }}
      has_android_x64: ${{ steps.native-matrix.outputs.has_android_x64 }}
      android_ndk_version: ${{ steps.native-matrix.outputs.android_ndk_version }}
      android_build_tools_version: ${{ steps.native-matrix.outputs.android_build_tools_version }}
      bundletool_version: ${{ steps.native-matrix.outputs.bundletool_version }}
      bundletool_sha256: ${{ steps.native-matrix.outputs.bundletool_sha256 }}
      android_16kb_system_image: ${{ steps.native-matrix.outputs.android_16kb_system_image }}

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix from release manifest
        id: native-matrix
        shell: pwsh
        env:
          REQUESTED_NATIVE_RIDS: ${{ inputs.native_rids }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
          PUBLISH_SELECTIVE_NUGET: ${{ inputs.publish_selective_nuget }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath '.github/release-tools/release-manifest.json' -Raw | ConvertFrom-Json -Depth 64
          if (-not $manifest.toolchains.androidNdkVersion -or [string]$manifest.toolchains.androidNdkVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release manifest must declare an exact stable toolchains.androidNdkVersion SDK revision.'
          }
          foreach ($toolchainProperty in @('androidBuildToolsVersion', 'bundletoolVersion', 'bundletoolSha256', 'android16KbSystemImage')) {
            if ([string]::IsNullOrWhiteSpace([string]$manifest.toolchains.$toolchainProperty)) {
              throw "Release manifest must declare toolchains.$toolchainProperty."
            }
          }
          if ([string]$manifest.toolchains.androidBuildToolsVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release manifest toolchains.androidBuildToolsVersion must be an exact SDK revision.'
          }
          if ([string]$manifest.toolchains.bundletoolVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release manifest toolchains.bundletoolVersion must be an exact stable version.'
          }
          if ([string]$manifest.toolchains.bundletoolSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Release manifest toolchains.bundletoolSha256 must be a lowercase SHA-256 hash.'
          }

          $allRids = @($manifest.rids | ForEach-Object { [string]$_.rid })
          $requestedText = [string]$env:REQUESTED_NATIVE_RIDS
          if ([string]::IsNullOrWhiteSpace($requestedText)) {
            $requestedRids = $allRids
          }
          else {
            $requestedParts = @($requestedText.Split(','))
            if (@($requestedParts | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
              throw 'Requested native RIDs must be a comma-separated list without empty entries.'
            }
            $requestedRids = @($requestedParts | ForEach-Object { $_.Trim() })
            if ($requestedRids.Count -ne @($requestedRids | Select-Object -Unique).Count) {
              throw "Requested native RIDs must be unique: $($requestedRids -join ', ')"
            }
            foreach ($requestedRid in $requestedRids) {
              if ($requestedRid -notin $allRids) {
                throw "Requested native RID is not declared in the release manifest: $requestedRid"
              }
            }
          }

          $include = @($manifest.rids | ForEach-Object {
            if ($_.rid -in $requestedRids) {
              [ordered]@{
                rid = $_.rid
                runner = $_.runner
                allow_cross_compile = ($_.os -eq 'windows' -and $_.arch -eq 'x86')
              }
            }
          })
          $selectedRids = @($include | ForEach-Object { [string]$_.rid })
          $fullScope = $selectedRids.Count -eq $allRids.Count -and
            @(Compare-Object -ReferenceObject @($allRids | Sort-Object) -DifferenceObject @($selectedRids | Sort-Object)).Count -eq 0
          $publishing = $env:PUBLISH_GITHUB -eq 'true' -or
            $env:PUBLISH_NUGET -eq 'true' -or
            $env:PUBLISH_SELECTIVE_NUGET -eq 'true'
          if (-not $fullScope -and $publishing) {
            throw 'Partial native RID scope requires all publish flags to be false.'
          }

          $matrix = @{ include = $include } | ConvertTo-Json -Depth 8 -Compress
          "native_matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bundle_count=$($include.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "selected_rids=$($selectedRids -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "full_scope=$($fullScope.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_android=$((@($selectedRids | Where-Object { $_ -like 'android-*' }).Count -gt 0).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_android_x64=$(($selectedRids -contains 'android-x64').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "android_ndk_version=$($manifest.toolchains.androidNdkVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "android_build_tools_version=$($manifest.toolchains.androidBuildToolsVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bundletool_version=$($manifest.toolchains.bundletoolVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bundletool_sha256=$($manifest.toolchains.bundletoolSha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "android_16kb_system_image=$($manifest.toolchains.android16KbSystemImage)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  native:
    name: Native ${{ matrix.rid }}
    if: ${{ !inputs.managed_only }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.native_matrix) }}

    env:
      SDL3CS_NATIVE_BUILD_PARALLEL_LEVEL: ${{ inputs.build_parallel_level }}
      SDL3CS_ANDROID_NDK_VERSION: ${{ needs.plan.outputs.android_ndk_version }}

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Install Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { $missing += 'nasm' }
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) { $missing += 'strawberryperl' }
          if ($missing.Count -gt 0) {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw "Chocolatey is required to install missing Windows tools: $($missing -join ', ')"
            }
            choco install @missing -y --no-progress
          }
          foreach ($path in @('C:\Program Files\NASM', 'C:\Strawberry\perl\bin')) {
            if (Test-Path -LiteralPath $path -PathType Container) {
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $path
            }
          }

      - name: Install Linux native tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake make ninja-build pkg-config nasm bison patchelf libjson-perl \
            autoconf automake libtool \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxrender-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpipewire-0.3-dev

      - name: Install Android NDK
        if: startsWith(matrix.rid, 'android-')
        shell: bash
        run: |
          set -eux
          test -n "${ANDROID_HOME:-}"
          ndk_version="$SDL3CS_ANDROID_NDK_VERSION"
          test -n "$ndk_version"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          fi
          test -x "$sdkmanager"

          ndk="$ANDROID_HOME/ndk/$ndk_version"
          source_properties="$ndk/source.properties"
          actual_ndk_version=""
          if [ -f "$source_properties" ]; then
            actual_ndk_version="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$source_properties")"
          fi

          if [ ! -f "$ndk/build/cmake/android.toolchain.cmake" ] || [ "$actual_ndk_version" != "$ndk_version" ]; then
            for attempt in 1 2 3; do
              rm -rf "$ndk" "$ANDROID_HOME/.temp"
              yes | "$sdkmanager" --licenses >/dev/null || true
              if "$sdkmanager" "ndk;$ndk_version"; then
                actual_ndk_version="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$source_properties")"
                if [ -f "$ndk/build/cmake/android.toolchain.cmake" ] && [ "$actual_ndk_version" = "$ndk_version" ]; then
                  break
                fi
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi

          test -f "$ndk/build/cmake/android.toolchain.cmake"
          test -f "$source_properties"
          actual_ndk_version="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$source_properties")"
          test "$actual_ndk_version" = "$ndk_version"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Install macOS native tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          brew update
          brew install nasm bison cpanminus
          cpanm --local-lib="$HOME/perl5" --notest JSON
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5:${PERL5LIB:-}" >> "$GITHUB_ENV"

      - name: Initialize native forks
        shell: pwsh
        run: ./.github/release-tools/Initialize-NativeForks.ps1 -Depth 1 -Retries 3

      - name: Build native bundle
        shell: pwsh
        run: |
          $buildParams = @{
            Rids = @('${{ matrix.rid }}')
            Clean = $true
            BuildParallelLevel = [int]'${{ inputs.build_parallel_level }}'
          }
          if ('${{ matrix.allow_cross_compile }}' -eq 'true') {
            $buildParams.AllowCrossCompile = $true
          }
          ./.github/release-tools/Invoke-NativeHostBuild.ps1 @buildParams

      - name: Smoke test ShaderCross DXC runtime
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          ./.github/release-tools/Test-ShaderCrossDxcRuntime.ps1 `
            -Rid '${{ matrix.rid }}' `
            -InstallRoot 'artifacts/release/native/SDL_shadercross/${{ matrix.rid }}/install'

      - name: Upload native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bundle-${{ matrix.rid }}
          path: artifacts/release/bundles/native-all-components-${{ matrix.rid }}.zip
          if-no-files-found: error

  assemble:
    name: Assemble NuGet packages
    if: ${{ !inputs.managed_only }}
    needs:
      - plan
      - native
    runs-on: windows-2025

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Install Android .NET workload for bridge package
        shell: pwsh
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Initialize native forks
        shell: pwsh
        run: ./.github/release-tools/Initialize-NativeForks.ps1 -Depth 1 -Retries 3

      - name: Download native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-bundle-*
          path: artifacts/release/bundles
          merge-multiple: true

      - name: Build wrapper Release output for Wiki contract
        shell: pwsh
        run: dotnet build ./SDL3-CS/SDL3-CS.csproj -c Release /p:GeneratePackageOnBuild=false

      - name: Assemble packages
        shell: pwsh
        env:
          SELECTED_NATIVE_RIDS: ${{ needs.plan.outputs.selected_rids }}
        run: |
          $bundles = @(Get-ChildItem -LiteralPath 'artifacts/release/bundles' -Filter '*.zip' -File | Sort-Object Name)
          $expectedBundleCount = [int]'${{ needs.plan.outputs.bundle_count }}'
          if ($bundles.Count -ne $expectedBundleCount) {
            throw "Expected $expectedBundleCount native bundle(s), got $($bundles.Count)."
          }

          $params = @{
            PackageRevision = [int]'${{ inputs.package_revision }}'
            BundlePath = @($bundles | ForEach-Object { $_.FullName })
          }
          $selectedRids = @($env:SELECTED_NATIVE_RIDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
          if ($selectedRids.Count -eq 0) {
            throw 'The native plan returned an empty selected RID scope.'
          }
          $params.Rids = $selectedRids
          if ('${{ inputs.require_upstream_current }}' -eq 'true') {
            $params.RequireForksUpToDate = $true
            $params.CheckUpstream = $true
            $params.RequireUpstreamCurrent = $true
          }

          ./.github/release-tools/Invoke-ReleaseAssembly.ps1 @params

      - name: Export release assembly state
        if: ${{ needs.plan.outputs.full_scope == 'true' }}
        shell: pwsh
        run: |
          $statePath = 'artifacts/release/release-assembly-state.zip'
          $stateRoot = 'artifacts/release/assembly-state-root'
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            Remove-Item -LiteralPath $statePath -Force
          }
          if (Test-Path -LiteralPath $stateRoot) {
            Remove-Item -LiteralPath $stateRoot -Recurse -Force
          }
          . ./.github/release-tools/Release.Common.ps1
          $manifest = Get-ReleaseManifest
          $packageRevision = [int]'${{ inputs.package_revision }}'
          $nativeLibRoots = @(Get-ReleasePackageVersions -Manifest $manifest -PackageRevision $packageRevision |
            Where-Object { $_.Kind -eq 'native' } |
            ForEach-Object { Join-Path (Split-Path -Parent $_.Project) 'lib' } |
            Sort-Object -Unique)
          $stateItems = @(
            'artifacts/release/nuget',
            'artifacts/release/receipts'
          ) + $nativeLibRoots
          foreach ($item in $stateItems) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Release assembly state path is missing: $item"
            }
          }
          foreach ($item in $stateItems) {
            $target = Join-Path $stateRoot $item
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $item -Destination $target -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $stateRoot '*') -DestinationPath $statePath -Force

      - name: Validate release assembly state
        if: ${{ needs.plan.outputs.full_scope == 'true' }}
        shell: pwsh
        run: |
          ./.github/release-tools/Test-ReleaseAssemblyState.ps1 `
            -PackageRevision ([int]'${{ inputs.package_revision }}') `
            -StatePath 'artifacts/release/release-assembly-state.zip'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: artifacts/release/nuget/*.nupkg
          if-no-files-found: error

      - name: Upload release assembly state
        if: ${{ needs.plan.outputs.full_scope == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assembly-state
          path: artifacts/release/release-assembly-state.zip
          if-no-files-found: error

  apple-consumer:
    name: Apple consumer ${{ matrix.name }}
    if: ${{ !inputs.managed_only && needs.plan.outputs.full_scope == 'true' }}
    needs:
      - plan
      - assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64 simulators
            runner: macos-26
            rids: iossimulator-arm64,tvossimulator-arm64
          - name: x64 simulators
            runner: macos-26-intel
            rids: iossimulator-x64,tvossimulator-x64

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -eux
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Install Apple .NET workloads
        shell: bash
        run: |
          set -eux
          dotnet workload install ios tvos --source https://api.nuget.org/v3/index.json

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: artifacts/release/nuget

      - name: Build Apple consumer apps
        shell: pwsh
        run: |
          $rids = '${{ matrix.rids }}' -split ','
          ./.github/release-tools/Test-AppleConsumerPackageBuild.ps1 `
            -PackageRevision ([int]'${{ inputs.package_revision }}') `
            -PackageDir 'artifacts/release/nuget' `
            -Rids $rids `
            -Configuration Debug

  android-consumer:
    name: Android consumer packages
    if: ${{ !inputs.managed_only && needs.plan.outputs.has_android == 'true' }}
    needs:
      - plan
      - assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Install Android .NET workload
        shell: bash
        run: |
          set -eux
          dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Install exact Android verification tools
        shell: bash
        env:
          ANDROID_BUILD_TOOLS_VERSION: ${{ needs.plan.outputs.android_build_tools_version }}
          BUNDLETOOL_VERSION: ${{ needs.plan.outputs.bundletool_version }}
          BUNDLETOOL_SHA256: ${{ needs.plan.outputs.bundletool_sha256 }}
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                sdkmanager="$candidate"
                break
              fi
            done
          fi
          test -x "$sdkmanager"

          yes | "$sdkmanager" --licenses >/dev/null || true
          installed=false
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "build-tools;$ANDROID_BUILD_TOOLS_VERSION"; then
              installed=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$installed" = true

          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          build_tools_source_properties="$build_tools/source.properties"
          test -f "$build_tools_source_properties"
          actual_build_tools_version="$(sed -n 's/^[[:space:]]*Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$build_tools_source_properties" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          test "$actual_build_tools_version" = "$ANDROID_BUILD_TOOLS_VERSION"
          zipalign="$build_tools/zipalign"
          test -x "$zipalign"

          bundletool_dir="$RUNNER_TEMP/sdl3cs-bundletool"
          mkdir -p "$bundletool_dir"
          bundletool="$bundletool_dir/bundletool-all-$BUNDLETOOL_VERSION.jar"
          bundletool_url="https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --retry 3 --retry-all-errors --output "$bundletool" "$bundletool_url"
          actual_bundletool_sha256="$(sha256sum "$bundletool" | awk '{print $1}')"
          test "$actual_bundletool_sha256" = "$BUNDLETOOL_SHA256"

          echo "ZIPALIGN_PATH=$zipalign" >> "$GITHUB_ENV"
          echo "BUNDLETOOL_PATH=$bundletool" >> "$GITHUB_ENV"

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: artifacts/release/nuget

      - name: Build Android consumer apps
        shell: pwsh
        env:
          SELECTED_NATIVE_RIDS: ${{ needs.plan.outputs.selected_rids }}
        run: |
          $selectedRids = @($env:SELECTED_NATIVE_RIDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
          $rids = @($selectedRids | Where-Object { $_ -like 'android-*' })
          if ($rids.Count -eq 0) {
            throw 'Android consumer validation requires at least one selected Android RID.'
          }
          ./.github/release-tools/Test-AndroidConsumerPackageBuild.ps1 `
            -PackageRevision ([int]'${{ inputs.package_revision }}') `
            -PackageDir 'artifacts/release/nuget' `
            -Rids $rids

      - name: Prepare Android x64 runtime APK
        if: ${{ needs.plan.outputs.has_android_x64 == 'true' }}
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem -LiteralPath 'artifacts/release/android-consumer-package-build' -Recurse -Filter '*-Signed.apk' -File |
            Where-Object { $_.FullName -match '[\\/]android-x64[\\/]' } |
            Sort-Object LastWriteTimeUtc -Descending)
          if ($apks.Count -eq 0) {
            throw 'Android x64 consumer build did not produce a signed APK for runtime validation.'
          }
          $target = 'artifacts/release/android-16kb-runtime/SDL3CSConsumer-android-x64-Signed.apk'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          Copy-Item -LiteralPath $apks[0].FullName -Destination $target -Force

      - name: Upload Android x64 runtime APK
        if: ${{ needs.plan.outputs.has_android_x64 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-x64-runtime-apk
          path: artifacts/release/android-16kb-runtime/SDL3CSConsumer-android-x64-Signed.apk
          if-no-files-found: error

  android-16kb-runtime:
    name: Android 16 KB runtime smoke
    if: ${{ !inputs.managed_only && needs.plan.outputs.has_android_x64 == 'true' }}
    needs:
      - plan
      - android-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_16KB_SYSTEM_IMAGE: ${{ needs.plan.outputs.android_16kb_system_image }}

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Android x64 runtime APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-x64-runtime-apk
          path: artifacts/release/android-16kb-runtime

      - name: Install exact Android 16 KB emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          avdmanager="$(command -v avdmanager || true)"
          if [ -z "$sdkmanager" ] || [ -z "$avdmanager" ]; then
            for tools_dir in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/bin"; do
              if [ -z "$sdkmanager" ] && [ -x "$tools_dir/sdkmanager" ]; then
                sdkmanager="$tools_dir/sdkmanager"
              fi
              if [ -z "$avdmanager" ] && [ -x "$tools_dir/avdmanager" ]; then
                avdmanager="$tools_dir/avdmanager"
              fi
            done
          fi
          test -x "$sdkmanager"
          test -x "$avdmanager"

          yes | "$sdkmanager" --licenses >/dev/null || true
          installed=false
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "platform-tools" "emulator" "$ANDROID_16KB_SYSTEM_IMAGE"; then
              installed=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$installed" = true
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"

          echo no | "$avdmanager" create avd --force --name sdl3cs-16kb --package "$ANDROID_16KB_SYSTEM_IMAGE"

      - name: Boot Android 16 KB emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          nohup "$emulator" -avd sdl3cs-16kb -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > "$RUNNER_TEMP/android-16kb-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-16kb-emulator.pid"
          "$adb" wait-for-device

          boot_completed=''
          for attempt in $(seq 1 120); do
            boot_completed="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/android-16kb-emulator.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/android-16kb-emulator.log"
              exit 1
            fi
            sleep 5
          done
          test "$boot_completed" = "1"
          test "$("$adb" shell getconf PAGE_SIZE | tr -d '\r')" = "16384"

      - name: Run Android 16 KB runtime smoke
        shell: pwsh
        run: |
          ./.github/release-tools/Test-Android16KbRuntime.ps1 `
            -ApkPath 'artifacts/release/android-16kb-runtime/SDL3CSConsumer-android-x64-Signed.apk' `
            -AdbPath "$env:ANDROID_HOME/platform-tools/adb"

      - name: Stop Android 16 KB emulator
        if: ${{ always() }}
        shell: bash
        run: "$ANDROID_HOME/platform-tools/adb emu kill || true"

  publish:
    name: Publish release
    needs:
      - assemble
      - apple-consumer
      - android-consumer
      - android-16kb-runtime
    if: ${{ !inputs.managed_only && (inputs.publish_github || inputs.publish_nuget) }}
    runs-on: windows-2025
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Initialize native forks
        shell: pwsh
        run: ./.github/release-tools/Initialize-NativeForks.ps1 -Depth 1 -Retries 3

      - name: Download release assembly state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assembly-state
          path: artifacts/release/state

      - name: Import release assembly state
        shell: pwsh
        run: |
          . ./.github/release-tools/Release.Common.ps1
          $manifest = Get-ReleaseManifest
          $packageRevision = [int]'${{ inputs.package_revision }}'
          $nativeLibRoots = @(Get-ReleasePackageVersions -Manifest $manifest -PackageRevision $packageRevision |
            Where-Object { $_.Kind -eq 'native' } |
            ForEach-Object { Join-Path (Split-Path -Parent $_.Project) 'lib' } |
            Sort-Object -Unique)
          $statePaths = @(
            'artifacts/release/nuget',
            'artifacts/release/receipts'
          ) + $nativeLibRoots
          foreach ($path in $statePaths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          Expand-Archive -LiteralPath 'artifacts/release/state/release-assembly-state.zip' -DestinationPath . -Force

      - name: Validate imported release assembly state
        shell: pwsh
        run: |
          ./.github/release-tools/Test-ReleaseAssemblyState.ps1 `
            -PackageRevision ([int]'${{ inputs.package_revision }}') `
            -StatePath '.'

      - name: NuGet trusted publishing login
        if: ${{ inputs.publish_nuget }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget_login
        with:
          user: edwardgushchin

      - name: Publish selected targets
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          $params = @{
            PackageRevision = [int]'${{ inputs.package_revision }}'
          }
          if ('${{ inputs.publish_github }}' -eq 'true') {
            $params.GitHubRelease = $true
          }
          if ('${{ inputs.publish_nuget }}' -eq 'true') {
            $params.NuGetPush = $true
          }
          if ('${{ inputs.require_upstream_current }}' -eq 'true') {
            $params.RequireUpstreamCurrent = $true
          }

          ./.github/release-tools/Publish-Release.ps1 @params

  managed-build:
    name: Build and validate managed package
    if: ${{ inputs.managed_only && !inputs.selective_native_repack }}
    needs: validate-mode
    runs-on: windows-2025

    steps:
      - name: Checkout SDL3-CS with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Validate managed-only release scope
        shell: pwsh
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          NATIVE_PACKAGE_REVISION: ${{ inputs.native_package_revision }}
          BASE_RELEASE_REF: ${{ inputs.base_release_ref }}
        run: |
          ./.github/release-tools/Test-ManagedReleaseScope.ps1 `
            -PackageRevision ([int]$env:PACKAGE_REVISION) `
            -NativePackageRevision ([int]$env:NATIVE_PACKAGE_REVISION) `
            -BaseRef $env:BASE_RELEASE_REF `
            -CheckNuGet

      - name: Restore managed projects
        shell: pwsh
        run: |
          dotnet restore .\SDL3-CS\SDL3-CS.csproj --force --no-cache
          dotnet restore .\SDL3-CS.Tests\SDL3-CS.Tests.csproj --force --no-cache

      - name: Build managed wrapper and tests
        shell: pwsh
        run: |
          dotnet build .\SDL3-CS\SDL3-CS.csproj -c Release --no-restore /p:GeneratePackageOnBuild=false
          dotnet build .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-restore

      - name: Restore published native runtime for managed tests
        shell: pwsh
        env:
          NATIVE_PACKAGE_REVISION: ${{ inputs.native_package_revision }}
        run: |
          ./.github/release-tools/Restore-ManagedReleaseTestRuntime.ps1 `
            -NativePackageRevision ([int]$env:NATIVE_PACKAGE_REVISION) `
            -Rid win-x64 `
            -Destination 'SDL3-CS.Tests/bin/Release/net8.0'

      - name: Run managed wrapper tests
        shell: pwsh
        run: dotnet run --project .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-build --no-restore

      - name: Audit public wrapper XML documentation
        shell: pwsh
        run: ./.github/release-tools/Test-PublicWrapperXmlDocs.ps1 -SourceRoot .\SDL3-CS

      - name: Pack managed NuGet package
        shell: pwsh
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision }}
        run: |
          ./.github/release-tools/Pack-NuGet.ps1 `
            -PackageRevision ([int]$env:PACKAGE_REVISION) `
            -OutputDir 'artifacts/release/nuget' `
            -ManagedOnly `
            -NoBuild

      - name: Validate managed NuGet package contents
        shell: pwsh
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision }}
        run: |
          ./.github/release-tools/Test-NuGetPackageContents.ps1 `
            -PackageRevision ([int]$env:PACKAGE_REVISION) `
            -PackageDir 'artifacts/release/nuget' `
            -ManagedOnly

      - name: Upload managed NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-nuget-package
          path: artifacts/release/nuget/SDL3-CS.*.nupkg
          if-no-files-found: error

  managed-publish:
    name: Publish managed package
    needs: managed-build
    if: ${{ inputs.managed_only && (inputs.publish_github || inputs.publish_nuget) }}
    runs-on: windows-2025
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout SDL3-CS with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download managed NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-nuget-package
          path: artifacts/release/nuget

      - name: NuGet trusted publishing login
        if: ${{ inputs.publish_nuget }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: managed_nuget_login
        with:
          user: edwardgushchin

      - name: Publish selected targets
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.managed_nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          NATIVE_PACKAGE_REVISION: ${{ inputs.native_package_revision }}
          BASE_RELEASE_REF: ${{ inputs.base_release_ref }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
        run: |
          $params = @{
            PackageRevision = [int]$env:PACKAGE_REVISION
            NativePackageRevision = [int]$env:NATIVE_PACKAGE_REVISION
            BaseReleaseRef = $env:BASE_RELEASE_REF
            PackageDir = 'artifacts/release/nuget'
            ManagedOnly = $true
          }
          if ($env:PUBLISH_GITHUB -eq 'true') {
            $params.GitHubRelease = $true
          }
          if ($env:PUBLISH_NUGET -eq 'true') {
            $params.NuGetPush = $true
          }

          ./.github/release-tools/Publish-Release.ps1 @params

  selective-repack:
    name: Repack selected published native packages
    if: ${{ inputs.selective_native_repack }}
    needs: validate-mode
    runs-on: windows-2025

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Clone only selected published packages
        shell: pwsh
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          PREVIOUS_PACKAGE_REVISION: ${{ inputs.previous_native_package_revision }}
          PACKAGE_IDS: ${{ inputs.selective_package_ids }}
          REPACK_MODE: ${{ inputs.selective_repack_mode }}
        run: |
          $ids = @($env:PACKAGE_IDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $params = @{
            PackageRevision = [int]$env:PACKAGE_REVISION
            PreviousPackageRevision = [int]$env:PREVIOUS_PACKAGE_REVISION
            PackageIds = $ids
            OutputDir = 'artifacts/release/nuget'
          }
          if ($env:REPACK_MODE -eq 'version-only') {
            $params.VersionOnly = $true
          }
          ./.github/release-tools/New-NativePackageRepack.ps1 @params

      - name: Prove package-only payload equivalence
        shell: pwsh
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          PREVIOUS_PACKAGE_REVISION: ${{ inputs.previous_native_package_revision }}
          PACKAGE_IDS: ${{ inputs.selective_package_ids }}
          REPACK_MODE: ${{ inputs.selective_repack_mode }}
        run: |
          $ids = @($env:PACKAGE_IDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $manifest = Get-Content -LiteralPath '.github/release-tools/release-manifest.json' -Raw | ConvertFrom-Json -Depth 64
          $rids = @($manifest.rids.rid)
          ./.github/release-tools/Test-NuGetPackageContents.ps1 `
            -PackageRevision ([int]$env:PACKAGE_REVISION) `
            -PackageIds $ids `
            -Rids $rids `
            -PackageDir 'artifacts/release/nuget'
          $validation = @{
            PackageRevision = [int]$env:PACKAGE_REVISION
            PreviousPackageRevision = [int]$env:PREVIOUS_PACKAGE_REVISION
            PackageIds = $ids
            PackageDir = 'artifacts/release/nuget'
          }
          if ($env:REPACK_MODE -eq 'version-only') {
            $validation.VersionOnly = $true
          }
          ./.github/release-tools/Test-NativePackageRepack.ps1 @validation
          if ($env:REPACK_MODE -eq 'add-libwebp-license') {
            $packagePaths = @(Get-ChildItem -LiteralPath 'artifacts/release/nuget' -Filter '*.nupkg' -File | ForEach-Object FullName)
            ./.github/release-tools/Test-ImageLibwebpLicenses.ps1 -PackagePaths $packagePaths
          }

      - name: Upload selected NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selective-native-repack-packages
          path: artifacts/release/nuget/*.nupkg
          if-no-files-found: error

  selective-publish:
    name: Publish selected native packages
    if: ${{ inputs.selective_native_repack && inputs.publish_selective_nuget }}
    needs: selective-repack
    runs-on: windows-2025
    environment: production

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download selected NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selective-native-repack-packages
          path: artifacts/release/nuget

      - name: NuGet trusted publishing login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: selective_nuget_login
        with:
          user: edwardgushchin

      - name: Publish only selected packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.selective_nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          PREVIOUS_PACKAGE_REVISION: ${{ inputs.previous_native_package_revision }}
          PACKAGE_IDS: ${{ inputs.selective_package_ids }}
          REPACK_MODE: ${{ inputs.selective_repack_mode }}
        run: |
          $ids = @($env:PACKAGE_IDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $params = @{
            PackageRevision = [int]$env:PACKAGE_REVISION
            PreviousPackageRevision = [int]$env:PREVIOUS_PACKAGE_REVISION
            PackageIds = $ids
            PackageDir = 'artifacts/release/nuget'
            NuGetPush = $true
          }
          if ($env:REPACK_MODE -eq 'version-only') {
            $params.VersionOnly = $true
          }
          ./.github/release-tools/Publish-NativePackageRepack.ps1 @params
