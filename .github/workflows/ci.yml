name: CI

on:
  pull_request:
    branches:
      - main
      - "release-*"
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  managed:
    name: Managed build and tests
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            7.0.x

      - name: Restore managed projects
        shell: pwsh
        run: |
          dotnet restore .\SDL3-CS\SDL3-CS.csproj --force --no-cache
          dotnet restore .\SDL3-CS.Tests\SDL3-CS.Tests.csproj --force --no-cache
          dotnet restore .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj --force --no-cache

      - name: Build managed wrapper and tests
        shell: pwsh
        run: |
          dotnet build .\SDL3-CS\SDL3-CS.csproj -c Release --no-restore /p:GeneratePackageOnBuild=false
          dotnet build .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-restore
          dotnet build .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj -c Release --no-restore /p:GeneratePackageOnBuild=false

      - name: Run managed main callback generator tests
        shell: pwsh
        run: dotnet run --project .\SDL3-CS.Generators.Tests\SDL3-CS.Generators.Tests.csproj -c Release --no-build --no-restore

      - name: Validate managed main callback package consumer
        shell: pwsh
        run: |
          dotnet pack .\SDL3-CS\SDL3-CS.csproj -c Release --no-restore `
            /p:PackageVersion=0.0.0-ci `
            /p:GeneratePackageOnBuild=false `
            --output .\artifacts\managed-main-callbacks
          .\.github\release-tools\Test-ManagedMainCallbacksPackage.ps1 `
            -PackagePath .\artifacts\managed-main-callbacks\SDL3-CS.0.0.0-ci.nupkg `
            -PackageVersion 0.0.0-ci

      - name: Restore published native runtime for managed tests
        shell: pwsh
        run: |
          ./.github/release-tools/Restore-ManagedReleaseTestRuntime.ps1 `
            -NativePackageRevision 1 `
            -Rid win-x64 `
            -Destination 'SDL3-CS.Tests/bin/Release/net8.0'

      - name: Run managed wrapper tests
        shell: pwsh
        run: dotnet run --project .\SDL3-CS.Tests\SDL3-CS.Tests.csproj -c Release --no-build --no-restore

      - name: Audit public wrapper XML documentation
        shell: pwsh
        run: ./.github/release-tools/Test-PublicWrapperXmlDocs.ps1 -SourceRoot .\SDL3-CS

  examples-desktop:
    name: Build desktop examples (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-15

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build all desktop examples
        shell: pwsh
        run: ./.github/release-tools/Test-ExampleProjects.ps1 -Configuration Release -Scope Desktop

  examples-android:
    name: Build Android example
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SDL3-CS
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Android .NET workload
        shell: pwsh
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Build all Android examples
        shell: pwsh
        run: ./.github/release-tools/Test-ExampleProjects.ps1 -Configuration Release -Scope Android
